services:
  postgres:
    image: postgres:16-alpine
    ports: ["5432:5432"]
    environment:
      POSTGRES_DB: framenote
      POSTGRES_USER: framenote
      POSTGRES_PASSWORD: framenote_dev
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U framenote -d framenote"]
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    build: .
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/framenote
      MEDIA_DIR: /media
      SPRING_JPA_DEFER_DATASOURCE_INITIALIZATION: "true"
      SPRING_SQL_INIT_MODE: always
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 251MB
    volumes: ["./media:/media"]
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:3000:80"]
    depends_on: [backend]
volumes:
  pgdata:
