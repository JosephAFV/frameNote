server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 251m;
  location / {
    add_header Cache-Control "no-store" always;
    try_files $uri $uri/ /index.html;
  }
  location /api/ {
    resolver 127.0.0.11 valid=10s;
    set $backend http://backend:8080;
    proxy_pass $backend;
    proxy_read_timeout 300s;
  }
}
